# Configuração do broker MQTT para desenvolvimento e testes.

listener 1883
protocol mqtt

# Sem senha apenas em desenvolvimento. Antes de usar com as placas reais,
# trocar por password_file e acl_file (ver docs/contrato-mqtt.md).
allow_anonymous true

# Guarda em disco as mensagens retidas e as sessões persistentes.
# É isso que permite ao consumidor receber o que foi publicado enquanto
# ele estava parado, mesmo que o broker reinicie nesse meio tempo.
persistence true
persistence_location /mosquitto/data/
autosave_interval 5

# Fila para clientes com sessão persistente que estão desconectados.
# Com 16 células a cada 20 s, 100 mil mensagens cobrem mais de 1 dia.
max_queued_messages 100000

log_dest stdout
log_type error
log_type warning
log_type notice
