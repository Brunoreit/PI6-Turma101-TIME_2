# Serve a interface e repassa /api/ para a API. Mesma origem, sem CORS.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_buffering off;   # streaming do CSV
    }
}
